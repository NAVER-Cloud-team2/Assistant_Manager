# 스테이징 서버 Nginx (담당: D). /etc/nginx/conf.d/assistant-manager.conf 로 복사.
# 도메인을 바꾸고 certbot으로 인증서를 받는다: sudo certbot --nginx -d example.com
# HTTPS는 필수다 — 휴대폰 브라우저는 HTTPS가 아니면 클립보드 복사를 막는다.

server {
    listen 80;
    server_name example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    # 주소에 관리·결과 토큰(/m/…, /r/…)이 들어가므로 접근 로그를 남기지 않는다.
    access_log off;

    client_max_body_size 256k;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }
}

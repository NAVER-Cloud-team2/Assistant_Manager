name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      MOCK_AI: "1"
      STORE: memory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # 운영 이미지 검사 (담당: D) — infra/Dockerfile·docker-entrypoint.sh와 운영 빌드의 암호화 정책을 실제 컨테이너로 확인한다.
  # 키는 실행마다 새로 만든 임시 값만 쓰고, 출력에서 가린다. 저장소·Secrets의 실제 키는 쓰지 않는다.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      IMAGE: assistant-manager:ci
      URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: 운영 이미지 빌드
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile
          load: true
          push: false
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 요청 본문 준비 (기준 예시 + CANARY 줄)
        run: |
          jq '{name: .eventName, roster: .roster}' tests/fixtures/garam-4.json > event.json
          jq '{lines: (.masked + [{no: "99", speaker: .roster[0], text: "CANARY-CI-5D1F 원문 노출 검사"}])}' \
            tests/fixtures/garam-4.json > excerpt.json

      - name: "① 키 없음 → 시작 거부 (종료 코드 78)"
        run: |
          set +e
          docker run --rm -e MOCK_AI=1 -e STORE=memory "$IMAGE" > out.txt 2>&1
          code=$?
          set -e
          cat out.txt
          test "$code" -eq 78
          grep -q "ENCRYPTION_KEY가 필요합니다" out.txt

      - name: "② 공백뿐인 키 → 시작 거부"
        run: |
          set +e
          ENCRYPTION_KEY="   " docker run --rm -e ENCRYPTION_KEY "$IMAGE" > out.txt 2>&1
          code=$?
          set -e
          cat out.txt
          test "$code" -eq 78

      - name: "③ 임시 키 → 정상 시작, app 사용자, 원문 저장·발행 흐름"
        run: |
          KEY="$(openssl rand -base64 32)"
          echo "::add-mask::$KEY"
          # 키는 명령 인자가 아니라 환경 변수로만 넘긴다
          ENCRYPTION_KEY="$KEY" docker run -d --name app -e ENCRYPTION_KEY -e MOCK_AI=1 -e STORE=memory \
            -p 127.0.0.1:3000:3000 "$IMAGE"
          for i in $(seq 1 30); do curl -fsS -o /dev/null "$URL/" && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' "$URL/")" = 200
          test "$(docker exec app whoami)" = app
          test "$(docker inspect -f '{{.State.Running}} {{.RestartCount}}' app)" = "true 0"

          created=$(curl -fsS -X POST "$URL/api/events" -H 'content-type: application/json' --data @event.json)
          id=$(jq -r .eventId <<<"$created"); admin=$(jq -r .adminToken <<<"$created")
          echo "::add-mask::$admin"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST "$URL/api/events/$id/excerpt" \
            -H 'content-type: application/json' -H "x-admin-token: $admin" --data @excerpt.json)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST "$URL/api/events/$id/publish" \
            -H 'content-type: application/json' -H "x-admin-token: $admin" --data '{"priorShared":"없음"}')" = 200

          docker logs app > app.log 2>&1
          # `! grep`은 set -e에서 실패로 잡히지 않으므로 if로 명시한다
          if grep -q "CANARY" app.log; then echo "로그에 원문(CANARY)이 남음" >&2; exit 1; fi
          if grep -qF "$KEY" app.log; then echo "로그에 키가 남음" >&2; exit 1; fi
          docker rm -f app

      - name: "④ 시작 검사를 우회해도 운영 빌드는 키 없이 원문을 저장하지 않음 (500, 로그에 CANARY 없음)"
        run: |
          docker run -d --name app-nokey --entrypoint node -e MOCK_AI=1 -e STORE=memory \
            -p 127.0.0.1:3000:3000 "$IMAGE" server.js
          for i in $(seq 1 30); do curl -fsS -o /dev/null "$URL/" && break; sleep 1; done

          created=$(curl -fsS -X POST "$URL/api/events" -H 'content-type: application/json' --data @event.json)
          id=$(jq -r .eventId <<<"$created"); admin=$(jq -r .adminToken <<<"$created")
          echo "::add-mask::$admin"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST "$URL/api/events/$id/excerpt" \
            -H 'content-type: application/json' -H "x-admin-token: $admin" --data @excerpt.json)" = 500

          docker logs app-nokey > app.log 2>&1
          grep -q "CryptoError\|ENCRYPTION_KEY가 없어" app.log
          if grep -q "CANARY" app.log; then echo "로그에 원문(CANARY)이 남음" >&2; exit 1; fi
          docker rm -f app-nokey

      - name: 실패 시 컨테이너 로그
        if: failure()
        run: |
          for c in app app-nokey; do docker logs "$c" 2>&1 | tail -50 || true; done

name: Deploy (staging · NAVER Cloud)

# 인프라 준비 전까지는 꺼져 있다. 저장소 Settings → Variables에 DEPLOY_ENABLED=true를 넣으면 켜진다.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  deploy:
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ secrets.NCR_REGISTRY }}/assistant-manager
    steps:
      - uses: actions/checkout@v4

      - name: Container Registry 로그인
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.NCR_REGISTRY }}
          username: ${{ secrets.NCP_ACCESS_KEY }}
          password: ${{ secrets.NCP_SECRET_KEY }}

      - name: 이미지 빌드·푸시
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

      - name: 스테이징 서버에서 재시작
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: /srv/assistant-manager/deploy.sh ${{ env.IMAGE }}:${{ github.sha }}
